async function compartilharPDF(doc, nome){
  const P = CapP();
  if (window.__capturaPDF) { window.__pdfs = window.__pdfs || []; window.__pdfs.push({ nome, b64:doc.output('datauristring').split(',')[1] }); return; }
  if (!P.Filesystem) {   /* navegador do notebook: baixa e manda a cópia direto para o SharePoint */
    doc.save(nome);
    if (conectado()) Docs.webEnviar(nome, doc.output('datauristring').split(',')[1]).catch(() => {});
    return;
  }
  try {
    const d = await Docs.guardar(nome, doc.output('datauristring').split(',')[1]);
    Docs.enviarPendentes();
    Docs.folhaGerado(d);
  } catch (e) { aviso('Não foi possível salvar o PDF: ' + (e.message || e), true); }
}

/* =====================================================================
   DOCUMENTOS GERADOS: cada PDF fica guardado no aparelho (pasta interna do app)
   e uma cópia vai para o SharePoint, em "Documentos gerados", ao lado da planilha.
   ===================================================================== */
const TIPOS_DOC = [['Etiqueta_', 'Etiqueta', 'Etiquetas'], ['Relatorio_', 'Relatório do lote', 'Relatórios de lote'],
  ['TesteCorte_', 'Teste de corte', 'Testes de corte'], ['Pedido_', 'Pedido de venda', 'Pedidos de venda']];
const PASTA_DOCS = 'Documentos gerados';
const Docs = {
  lista(){ return Arm.ler('docs', []); },
  gravarLista(l){ Arm.gravar('docs', l); this.marcador(); },
  tipo(nome){ return TIPOS_DOC.find(([p]) => nome.startsWith(p)) || ['', 'Documento', 'Outros']; },
  pendentes(){ return this.lista().filter(d => d.nuvem !== 'ENVIADO' && d.nuvem !== 'FALHOU'); },
  marcador(){ const b = $('#docsPend'); if (!b) return; const n = this.pendentes().length; b.hidden = !n; b.textContent = n; },
  nomeFinal(nome){ const t = new Date(), z = n => String(n).padStart(2, '0');
    return nome.replace(/\.pdf$/i, '') + '_' + `${t.getFullYear()}${z(t.getMonth() + 1)}${z(t.getDate())}-${z(t.getHours())}${z(t.getMinutes())}${z(t.getSeconds())}` + '.pdf'; },
  /* navegador: não há pasta do app; o PDF vai direto para o SharePoint e a lista guarda o link */
  async webEnviar(nome, b64){
    const tp = this.tipo(nome), c = Cfg.get();
    const d = { id:uuid(), nome:this.nomeFinal(nome), tipo:tp[1], pasta:tp[2], criadoEm:agoraISO(), aparelho:c.aparelho || 'notebook', usuario:Auth.usuario() || '', uri:null, nuvem:'PENDENTE' };
    this.gravarLista([d, ...this.lista()].slice(0, 500));
    try { const url = await this.enviar(d, Uint8Array.from(atob(b64), ch => ch.charCodeAt(0)));
      this.gravarLista(this.lista().map(x => x.id === d.id ? { ...x, nuvem:'ENVIADO', webUrl:url } : x)); }
    catch (e) { this.gravarLista(this.lista().map(x => x.id === d.id ? { ...x, nuvem:'FALHOU', erro:e.message || String(e) } : x)); }
  },
  async guardar(nome, b64){
    const final = this.nomeFinal(nome);
    const r = await CapP().Filesystem.writeFile({ path:'documentos/' + final, data:b64, directory:'DATA', recursive:true });
    const tp = this.tipo(nome), c = Cfg.get();
    const d = { id:uuid(), nome:final, tipo:tp[1], pasta:tp[2], criadoEm:agoraISO(), aparelho:c.aparelho || '', usuario:Auth.usuario() || '', uri:r.uri, nuvem:'PENDENTE' };
    this.gravarLista([d, ...this.lista()].slice(0, 500));
    return d;
  },
  async abrir(d){
    const P = CapP();
    if (!P.Filesystem) { if (d.webUrl) window.open(d.webUrl, '_blank'); else aviso('Este PDF não chegou ao SharePoint. Gere de novo.', true); return; }
    try {
      if (P.FileOpener) await P.FileOpener.open({ filePath:d.uri, contentType:'application/pdf', openWithDefault:true });
      else await this.compartilhar(d);
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) aviso('Nenhum app para abrir PDF neste celular. Use “Compartilhar”.', true); }
  },
  async compartilhar(d){
    if (!CapP().Share) { if (!d.webUrl) return aviso('Este PDF não chegou ao SharePoint.', true);
      try { await navigator.clipboard.writeText(d.webUrl); aviso('Link do SharePoint copiado.'); } catch (e) { window.open(d.webUrl, '_blank'); } return; }
    try { await CapP().Share.share({ title:d.nome, url:d.uri, dialogTitle:'Compartilhar ' + d.nome }); }
    catch (e) { if (!/cancel/i.test(String(e && e.message))) aviso('Não foi possível compartilhar: ' + (e.message || e), true); }
  },
  /* pasta do SharePoint: a mesma da planilha conectada */
  async pastas(sub){
    const c = Cfg.get(), enc = encodeURIComponent;
    let R = Arm.ler('docsPastas', null);
    if (!R || R.item !== c.itemId) {
      const it = await graph('GET', `/drives/${enc(c.driveId)}/items/${enc(c.itemId)}?$select=parentReference`);
      R = { item:c.itemId, drive:c.driveId, pai:it.parentReference.id, ids:{} };
    }
    const garantir = async (paiId, nome) => {
      try { const f = await graph('POST', `/drives/${enc(R.drive)}/items/${enc(paiId)}/children`, { name:nome, folder:{}, '@microsoft.graph.conflictBehavior':'fail' }); return f.id; }
      catch (e) { if (e.status !== 409) throw e; const f = await graph('GET', `/drives/${enc(R.drive)}/items/${enc(paiId)}:/${enc(nome)}?$select=id`); return f.id; }
    };
    if (!R.ids[PASTA_DOCS]) R.ids[PASTA_DOCS] = await garantir(R.pai, PASTA_DOCS);
    if (!R.ids[sub]) R.ids[sub] = await garantir(R.ids[PASTA_DOCS], sub);
    Arm.gravar('docsPastas', R);
    return { drive:R.drive, pasta:R.ids[sub], raiz:R.ids[PASTA_DOCS] };
  },
  async enviar(d, binPronto){
    const P = CapP(), enc = encodeURIComponent;
    let bin = binPronto;
    if (!bin) { const f = await P.Filesystem.readFile({ path:'documentos/' + d.nome, directory:'DATA' }); bin = Uint8Array.from(atob(f.data), ch => ch.charCodeAt(0)); }
    const alvo = await this.pastas(d.pasta);
    const tk = await Auth.token();
    /* File como corpo: o Capacitor envia o binário sem alterar (base64 → bytes no Android) */
    const r = await fetch(`${GRAPH}/drives/${enc(alvo.drive)}/items/${enc(alvo.pasta)}:/${enc(d.nome)}:/content?@microsoft.graph.conflictBehavior=rename`,
      { method:'PUT', headers:{ Authorization:'Bearer ' + tk }, body:new File([bin], d.nome, { type:'application/pdf' }) });
    const txt = await r.text(); let j = {}; try { j = JSON.parse(txt); } catch (e) {}
    if (!r.ok) { const e = new Error(traduzErro(r.status, j)); e.status = r.status; if (r.status === 401) e.login = true; throw e; }
    return j.webUrl || null;
  },
  enviando:false,
  async enviarPendentes(){
    if (this.enviando || !conectado() || !navigator.onLine || !CapP().Filesystem) return;
    this.enviando = true;
    try {
      for (const p of this.pendentes()) {
        try { const url = await this.enviar(p); this.gravarLista(this.lista().map(x => x.id === p.id ? { ...x, nuvem:'ENVIADO', webUrl:url, erro:null } : x)); }
        catch (e) { this.gravarLista(this.lista().map(x => x.id === p.id ? { ...x, erro:e.message || String(e) } : x)); if (e.login) break; }
      }
    } finally { this.enviando = false; if ($('#folha').dataset.tela === 'docs') telaDocs(); }
  },
  folhaGerado(d){
    abrirFolha('Documento gerado', `
      <div class="previa"><p><b>${esc(d.tipo)}</b></p><p style="word-break:break-all">${esc(d.nome)}</p></div>
      <p class="nota">Guardado neste celular. ${conectado() ? 'Uma cópia vai para o SharePoint (pasta “Documentos gerados”).' : 'A cópia para o SharePoint vai quando o app estiver conectado à planilha.'}</p>
      <p class="nota">Para ver de novo depois: botão <b>Documentos</b> no topo da tela.</p>`,
      `<button class="btn sec" id="dgComp">Compartilhar</button><button class="btn prim" id="dgAbrir">Abrir</button>`);
    $('#dgAbrir').onclick = () => this.abrir(d);
    $('#dgComp').onclick = () => this.compartilhar(d);
  },
};
let filtroDocs = 'TODOS';
function telaDocs(){
  const todos = Docs.lista(), tipos = ['TODOS', ...TIPOS_DOC.map(t => t[1])];
  const lista = todos.filter(d => filtroDocs === 'TODOS' || d.tipo === filtroDocs);
  const pend = Docs.pendentes().length, R = Arm.ler('docsPastas', null);
  const quando = iso => new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
  abrirFolha('Documentos', `
    ${chips('dTipo', tipos.map(t => ({ v:t, r:t === 'TODOS' ? 'Todos' : t })), filtroDocs)}
    ${pend ? `<p class="nota">${pend} documento(s) ainda não foram para o SharePoint. ${conectado() ? 'Eles vão sozinhos quando houver internet.' : 'Conecte a conta e a planilha em Ajustes.'}</p>` : ''}
    ${lista.length ? lista.map(d => `<div class="doc"><div class="t"><b>${esc(d.nome)}</b><small>${esc(d.tipo)} · ${quando(d.criadoEm)}${d.usuario ? ' · ' + esc(d.usuario) : ''} · ${d.nuvem === 'ENVIADO' ? 'no SharePoint ✓' : d.erro ? 'erro no envio: ' + esc(d.erro) : 'aguardando envio'}</small></div>
      <div class="bt"><button data-dabrir="${esc(d.id)}">Abrir</button><button data-dcomp="${esc(d.id)}">Enviar</button></div></div>`).join('')

/* QR code desenhado em vetor no PDF (nítido em qualquer impressora) */
function desenharQR(doc, texto, x, y, lado){
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  const n = q.getModuleCount(), c = lado / n;
  doc.setFillColor(0, 0, 0);
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) doc.rect(x + k * c, y + r * c, c + 0.03, c + 0.03, 'F');
}

/* =====================================================================
   FICHA DO VOLUME: um PDF por volume, sempre atualizado, no SharePoint
   ("Documentos gerados/Fichas de volume/Ficha_<código>.pdf"). O QR code da etiqueta
   aponta para um link fixo desse arquivo; quando o volume, um teste ou um laudo muda,
   o app gera a ficha de novo e substitui o arquivo (o link continua o mesmo).
   ===================================================================== */
const Ficha = {
  nome: cod => `Ficha_${nomeArquivo(cod)}.pdf`,
  lotesDe(v){ const c = Est.composicao(v.Codigo).map(x => x.Lote); return c.length ? c : (v.LoteOrigem ? [v.LoteOrigem] : []); },
  testesDe(v){ const L = this.lotesDe(v);
    return DB.t('tblAnalises').filter(a => a.Volume === v.Codigo || (!a.Volume && a.Lote && L.includes(a.Lote))).sort((a, b) => (a.DataAnalise || '').localeCompare(b.DataAnalise || '')); },
  afetados(tabela, reg){
    const vols = DB.t('tblVolumes').filter(v => v.FichaURL);
    const comLote = lote => vols.filter(v => this.lotesDe(v).includes(lote)).map(v => v.Codigo);
    if (tabela === 'tblVolumes') return reg.FichaURL ? [reg.Codigo] : [];
    if (tabela === 'tblLaudos' || tabela === 'tblComposicao') return vols.filter(v => v.Codigo === reg.Volume).map(v => v.Codigo);
    if (tabela === 'tblAnalises') return reg.Volume ? vols.filter(v => v.Codigo === reg.Volume).map(v => v.Codigo) : comLote(reg.Lote);
    if (tabela === 'tblLotes') return comLote(reg.Lote);
    return [];
  },
  marcar(cods){ if (!cods.length) return; Arm.gravar('fichasPend', [...new Set([...Arm.ler('fichasPend', []), ...cods])]); },
  gerarPDF(v){
    const doc = novoPDF('a4'), W = 210, M = 15, lotes = this.lotesDe(v), testes = this.testesDe(v);
    const laudos = DB.t('tblLaudos').filter(l => l.Volume === v.Codigo);
    const comp = Est.composicao(v.Codigo);
    doc.addImage(LOGO_PNG, 'PNG', M, 12, 28, 28 * 300 / 532);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110); doc.text('FICHA DO VOLUME · CACAU EM AMÊNDOAS', W - M, 15, { align:'right' }); doc.setTextColor(0);
    doc.setFont('helvetica', 'bold'); let fs = 20; while (fs > 10 && doc.setFontSize(fs).getTextWidth(v.Codigo) > 135) fs -= 1;
    const lc = doc.splitTextToSize(v.Codigo, 135); lc.forEach((t, i) => doc.text(t, W - M, 24 + i * fs * 0.4, { align:'right' }));
    let y = 30 + (lc.length - 1) * fs * 0.4;
    doc.setFillColor(0, 0, 0); doc.rect(M, y, W - 2 * M, 11, 'F'); doc.setTextColor(255); doc.setFontSize(18);
    doc.text(v.TipoClassificado || 'AGUARDANDO CLASSIFICAÇÃO', W / 2, y + 7.8, { align:'center' }); doc.setTextColor(0); y += 19;
    const kv = (k, val) => { doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(100); doc.text(k, M, y); doc.setTextColor(0); doc.setFont('helvetica', 'bold'); doc.text(String(val), M + 50, y); y += 6.5; };
    const titulo = t => { y += 3; doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(176, 72, 32); doc.text(t.toUpperCase(), M, y); doc.setTextColor(0); doc.setLineWidth(0.2); doc.line(M, y + 2, W - M, y + 2); y += 8; };
    titulo('Identificação');

  titulo('Classificação'); y += 9;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(a.Classificacao || 'Não classificado', M, y); y += 7;
  if (!cliente) {
    const sug = Analise.sugerir(a, s.tipoVol);
    doc.setFontSize(9.5); doc.setFont('helvetica', 'normal'); doc.setTextColor(100); doc.text('Sugerida pelas regras:', M, y); doc.setTextColor(0); doc.setFont('helvetica', 'bold'); doc.text(String(sug || '—'), M + 42, y); y += 6;
    const quebra = (rot, txt) => { if (!txt) return; doc.setFont('helvetica', 'normal'); doc.setTextColor(100); doc.text(rot, M, y); doc.setTextColor(0);
      doc.splitTextToSize(String(txt), W - 2 * M - 42).forEach(l => { if (y > LIM) novaPag(); doc.text(l, M + 42, y); y += 5; }); y += 1; };
    quebra('Motivo da alteração:', a.MotivoAlteracao); quebra('Observação:', a.Obs);
  }
  rodape();
  if (alvo) return;
  await compartilharPDF(doc, `TesteCorte_${nomeArquivo(s.codigo)}_${a.DataAnalise || ''}${cliente ? '_cliente' : ''}.pdf`);
}

$('#tela').addEventListener('click', async e => {
  const et = e.target.closest('[data-etapa]'); if (et) { Estado.etapa = et.dataset.etapa; render(); return; }
  const c = e.target.closest('[data-lote]'); if (c) { abrirLote(c.dataset.lote); return; }
  if (e.target.id === 'cfgSalvar') {
    const cli = $('#cfgCli').value.trim(), ten = $('#cfgTen').value.trim();
    if (cli && !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(cli)) return aviso('O ID do aplicativo tem o formato 00000000-0000-0000-0000-000000000000.', true);
    if (!ten) return aviso('Informe o domínio da empresa.', true);
    const mudou = cli !== Cfg.get().clientId || ten !== Cfg.get().tenant;
    Cfg.set({ aparelho:$('#cfgApar').value.trim(), clientId:cli, tenant:ten }); if (mudou) Auth.sair();
    aviso('Ajustes salvos.'); render(); return;
  }
  if (e.target.id === 'cfgEntrar') { Auth.entrar(); return; }
  if (e.target.id === 'cfgSair') { if (await confirmar('Sair da conta?', 'O app para de sincronizar até alguém entrar de novo. Os dados do aparelho continuam guardados.', 'Sair')) { Auth.sair(); render(); atualizarSync(); } return; }
  if (e.target.id === 'cfgSinc') { sincronizar(true); return; }
  if (e.target.id === 'cfgPlanilha') {
    const link = $('#cfgLink').value.trim();
    if (!/^https:\/\/\S+$/.test(link)) return aviso('Cole o link da planilha (começa com https://).', true);
    e.target.disabled = true; e.target.textContent = 'Procurando a planilha…';
    try {
      const f = await Planilha.localizar(link);
      Cfg.set({ link, driveId:f.driveId, itemId:f.itemId, nomePlanilha:f.nome });
      await Planilha.ler('tblLotes');              // confirma que é a planilha certa
      aviso(`Planilha ${f.nome} conectada.`); render(); sincronizar(true);
    } catch (err) {
      Cfg.set({ driveId:'', itemId:'', nomePlanilha:'' });
      aviso(err.status === 404 ? 'Arquivo encontrado, mas sem a tabela tblLotes: confira se é a planilha da safra.' : err.message, true); render();
    }
    return;
  }
  if (e.target.id === 'cfgClientes') { listaClientes(); return; }
  if (e.target.id === 'cfgVariedades') { listaVariedades(); return; }
  if (e.target.id === 'cfgSugestoes') { listaSugestoes(); return; }
  const v = e.target.closest('[data-vol]'); if (v) { abrirVolume(v.dataset.vol); return; }
  const cl = e.target.closest('[data-classe]'); if (cl) { Estado.tela = 'estoque'; Estado.filtroEst = 'EM ESTOQUE'; Estado.buscaEst = cl.dataset.classe; render(); window.scrollTo(0, 0); return; }
  const fe = e.target.closest('[data-fest]'); if (fe) { Estado.filtroEst = fe.dataset.fest; render(); return; }
  const al = e.target.closest('[data-analisar-lote]'); if (al) { formAnalise(null, al.dataset.analisarLote); return; }
  const an = e.target.closest('[data-analisar]'); if (an) { formAnalise(DB.get('tblVolumes', an.dataset.analisar)); return; }
  const ld = e.target.closest('[data-laudo]'); if (ld) { const l = DB.get('tblLaudos', ld.dataset.laudo); if (l) abrirVolumePorCodigo(l.Volume); return; }
  if (e.target.id === 'btnVenda') { formPedido(); return; }
  if (e.target.closest('#btnPedidos')) { listaPedidos(); return; }
  if (e.target.id === 'btnProcesso') { formProcesso(); return; }
  if (e.target.id === 'cfgApagar') {
    const n = Fila.itens().length;
    if (await confirmar('Apagar dados do aparelho?', n ? `Atenção: ${n} alteração(ões) ainda não foram enviadas e serão perdidas.` : 'Os dados continuam na planilha e voltam na próxima sincronização.', 'Apagar')) {
      const manter = ['cfg', 'auth', 'usuario'].map(k => PFX + k);
      Object.keys(localStorage).filter(k => k.startsWith(PFX) && !manter.includes(k)).forEach(k => localStorage.removeItem(k));
      [...Object.keys(ESQUEMA), ...Object.keys(LISTAS_PADRAO)].forEach(t => delete DB['_' + t]);
      Sync.ultimo = null; aviso('Dados apagados.'); render(); atualizarSync();
    }
  }
});
$('#tela').addEventListener('input', e => { if (e.target.id === 'buscaEst') { Estado.buscaEst = e.target.value; const pos = e.target.selectionStart; render(); const b = $('#buscaEst'); b.focus(); b.setSelectionRange(pos, pos); return; }
  if (e.target.id === 'busca') { Estado.busca = e.target.value; const pos = e.target.selectionStart; render(); const b = $('#busca'); b.focus(); b.setSelectionRange(pos, pos); } });
document.addEventListener('click', e => {

/* ----- Sugestões de ajuste (2.9.0) ----- */
const NOMES_TELA = { lotes:'Lotes', secagem:'Secagem', estoque:'Estoque', qualidade:'Qualidade', resumo:'Resumo', ajustes:'Ajustes' };
function contextoTela(){ const f = $('#folha'); const aberta = f && !f.hidden && f.classList.contains('aberta');
  return (NOMES_TELA[Estado.tela] || Estado.tela) + (aberta ? ' › ' + $('#folhaTitulo').textContent : ''); }
function sugerirAjuste(){
  const ctx = contextoTela(), d = document.createElement('div'); d.className = 'confirma';
  d.innerHTML = `<div class="caixa sugest" role="dialog" aria-modal="true" aria-labelledby="sgT"><h3 id="sgT">Sugerir um ajuste no app</h3>
    <p class="ctx">Tela: <b>${esc(ctx)}</b> · versão ${VERSAO}</p>
    ${chips('sgTipo', [{v:'PROBLEMA',r:'Problema'},{v:'MELHORIA',r:'Melhoria'},{v:'NOVA FUNÇÃO',r:'Nova função'}], 'PROBLEMA')}
    <textarea id="sgTxt" placeholder="O que aconteceu ou o que você gostaria? Ex.: ao salvar a pesagem, a data voltou para hoje."></textarea>
    <span class="rotulo" style="display:block;font-weight:800;font-size:14px;margin-bottom:6px">Prioridade</span>
    ${chips('sgPri', [{v:'URGENTE',r:'Urgente',s:'atrapalha o trabalho'},{v:'IMPORTANTE',r:'Importante'},{v:'PODE ESPERAR',r:'Pode esperar'}], 'IMPORTANTE')}
    <p class="ctx" style="margin-top:10px">Vai para a aba “Sugestoes” da planilha e entra na rodada mensal de ajustes.</p>
    <div class="bts"><button class="btn sec" data-r="0">Cancelar</button><button class="btn prim" data-r="1">Enviar sugestão</button></div></div>`;
  document.body.appendChild(d); setTimeout(() => d.querySelector('#sgTxt').focus(), 50);
  d.addEventListener('click', e => {
    const b = e.target.closest('[data-r]'); if (!b && e.target !== d) return;
    if (b && b.dataset.r === '1') {
      const txt = d.querySelector('#sgTxt').value.trim();
      if (txt.length < 5) { d.querySelector('#sgTxt').classList.add('invalido'); return; }
      const t = new Date(), z = n => String(n).padStart(2, '0'), c = Cfg.get();
      const id = `SG-${t.getFullYear()}${z(t.getMonth() + 1)}${z(t.getDate())}-${z(t.getHours())}${z(t.getMinutes())}${z(t.getSeconds())}-${Math.random().toString(36).slice(2, 5).toUpperCase()}`;
      salvar('tblSugestoes', { ID:id, SugestaoID:id, Data:hojeISO(), Usuario:Auth.usuario() || '', Aparelho:c.aparelho || (NATIVO ? 'celular' : 'notebook'), Versao:VERSAO,
        Tela:ctx, Tipo:valChip('sgTipo'), Prioridade:valChip('sgPri'), Descricao:txt, Situacao:'NOVA', Resposta:null }, [], true);
      aviso('Sugestão registrada. Obrigado!');
    }
    d.remove();
  });
}
function listaSugestoes(){
  const l = DB.t('tblSugestoes').slice().sort((a, b) => String(b.SugestaoID).localeCompare(String(a.SugestaoID)));
  abrirFolha('Sugestões de ajuste', l.length ? `<p class="nota">A rodada de ajustes acontece na primeira segunda-feira de cada mês, a partir desta lista.</p>
    <dl class="grade">${l.slice(0, 150).map(x => `<div style="display:block"><dt><b>${esc(x.Tipo || '')}</b> · ${esc((x.Prioridade || '').toLowerCase())} · ${fmtData(x.Data)} · ${esc(x.Usuario || x.Aparelho || '')}</dt>
      <dd style="text-align:left;font-weight:400;margin-top:4px">${esc(x.Descricao || '')}<br><small style="color:var(--apagado)">${esc(x.Tela || '')} · ${esc((x.Situacao || 'NOVA').toLowerCase())}${x.Resposta ? ' — ' + esc(x.Resposta) : ''}</small></dd></div>`).join('')}</dl>`
    : '<p class="vazio"><strong>Nenhuma sugestão ainda</strong>Use a lâmpada no topo da tela para registrar.</p>', `<button class="btn prim" id="sgNova">Nova sugestão</button>`);
  $('#sgNova').onclick = sugerirAjuste;
}
